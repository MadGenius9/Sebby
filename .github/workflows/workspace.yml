name: Sebby workspace checks
on:
  push:
    branches: [sebby-v2]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:workspace
      - run: npm run test:http
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          SEBBY_QA_DIR: ${{ runner.temp }}/sebby-browser-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sebby-browser-evidence
          path: ${{ runner.temp }}/sebby-browser-evidence
          if-no-files-found: ignore
